<!DOCTYPE html>
<html lang="ru">
  <!-- lang это атрибут., если установлен en, то браузер будет ожидать англо сайт. хоть мы и будем писать на ру.-->
  <head>
    <!-- Тэг head, здесь будет прописана МЕТА-информация, charset это атрибут. -->
    <meta charset="UTF-8" />
    <!-- Тэг meta является одинарным, он не закрывается. name и content это атрибуты. мета содержит какие-то скрытые настройки нашего документа. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Шляпа усатая</title>
    <!-- Тэг title - это заголовок вкладки в браузере.-->
  </head>
  <body>
    <h1>Это мой первый HTML документ!</h1>
  </body>
</html>
