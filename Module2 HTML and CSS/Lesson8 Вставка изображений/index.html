<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>image</title>
    <link rel="shortcut icon" href="favicon-money-image.png" type="image/png" />
  </head>
  <body>
    <img
      src="cbr.png"
      alt="Cпортивный мотоцикл компании Honda, модель для средней весовой категории."
      width="700"
      height="500"
    />
    <img
      src="https://doka.guide/html/img/images/covers/desktop.svg"
      alt="Лежит девушка в тоге, в античном стиле и показывает рукой на браузер, где открыта картинка с девушкой в абстракции"
      width="700"
      height="500"
    />
  </body>
</html>
<!-- Тег img для вставки изображений, является одиночным тегом
         Мы не можем вставлять текст сюда и другие теги, как и любой другой контент внутри этого элемента.
     Атрибут src - сокращенно source, путь к изображению.
     Атрибут alt - (не обязательный, но лучше пусть будут оба атрибута) существует для того чтобы описывать наше изоражение. Например для скрин-ридеров. Чтобы пользщователи с ограничеными возможностями смогли прочитать об этом.
     Атрибут height можно не писать и интерпретатор кода сам подтянет высоту изображения
     src="cbr.png" это локальное расположение изображения.-->
