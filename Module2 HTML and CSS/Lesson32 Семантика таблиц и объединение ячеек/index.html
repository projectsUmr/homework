<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Семантика таблиц и объединение ячеек</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <table>
      <caption>
        Документы для сторнирования
      </caption>
      <thead>
        <tr>
          <th>#</th>
          <th>Дата</th>
          <th>Номер</th>
          <th>Кол-во</th>
          <th>Сумма</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>2026-02-05</td>
          <td>14442</td>
          <td>8</td>
          <td>45000</td>
        </tr>
        <tr>
          <td>2</td>
          <td>2026-02-05</td>
          <td>14445</td>
          <td>16</td>
          <td>90000</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="3"></td>
          <td>Итого:</td>
          <td>135000</td>
        </tr>
      </tfoot>
    </table>
    <table>
      <tr>
        <td rowspan="2">Большая</td>
        <td>Маленькая</td>
      </tr>
      <tr>
        <td>Маленькая</td>
      </tr>
    </table>
  </body>
</html>

<!-- Таблицы нужны для того чтобы хранить там какую-то информацию. Группировать, создавать колонки, задавать им заголовки, хранить информацию.  Таблицы на современных сайтах используются не так часто. Есть определенные нюансы, но таблицы знать важно. 
 
Раньше вся верстка строилась на таблицах, т.к. CSS не был так сильно развит как сейчас.

На таблицах все еще верстают, например для email писем. Бывают приходят письма которые приходят на какой-то вебсайт или визитку. Это и делается с помощью таблиц.

<table> - тег таблицы. Она состоит из рядов и ячеек. 
<caption> - заголовок для таблицы.
<th> (tableHead) - Чтобы создать заголовок.
<tr> (tableRow) - Чтобы создать ряд
<td> - чтобы создать ячейку.

    Таблицы тяжело контроллировать на мобильных устройствах.


откуда в браузере мы видим тег <tbody> ? ведь здесь его мы не писали. Все просто, таблица разделяется на логические части. Есть тело таблицы tbody(где основная информация) Есть  thead(заголовок) и tfoot (подвал). В общем это  нужно для смыслового  и семантического  обозначения нашего контента.

colspan - данное свойство позволяет объединять наши ячейки по стобцам.
rowspan - данное свойство позволяет объединять наши ячейки по строкам.
-->
