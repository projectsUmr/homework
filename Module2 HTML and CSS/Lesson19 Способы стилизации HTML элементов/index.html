<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StyleTypes</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <h1>ХУЙ ПИЗДА ДЖИГУРДА</h1>
    <h1>ХУЙ ПИЗДА СКОВОРОДА</h1>
    <h1 style="color: orange; width: 250">Морковка</h1>
    <h1 style="color: red; width: 250">Помидор</h1>
    <h1 style="color: yellow; width: 250">Банан</h1>
  </body>
</html>

<!-- Помимо прописывания стиля отдельным тегом <style>, где например h1 будет относиться ко всем h1, можно прописывать стиль КОНКРЕТНОМУ ЭЛЕМЕНТУ.   
     Но это далеко не лучший вариант.

     Подобный способ стилизации называют inline стилями, где мы прописываем стили для конкретных элементов. Он не очень удобный, обычно не рекомндуют использовать тег <style>, хотя бы на начальных этапах, т.к. мы только учим CSS.  Данный способ используется при работе с JS.

    Чтобы подключить к файлу HTML файл CSS - надо в теге head прописать link, можно хоть где, но принято именно в head это делать.
    Также в теге link мсожно добавить favicon (атрибут rel="stylesheet" означает добавление стилей)
    
    Принятно под css файлы создавать отдельную директорию и держать их все там.
    -->
