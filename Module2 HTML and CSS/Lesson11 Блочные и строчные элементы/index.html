<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Поток: Блочные и строчные элементы.</title>
  </head>
  <body>
    <p>
      Далеко-далеко за словесными горами, в стране гласных
      <span lang="en">and</span> согласных живут рыбные тексты.
    </p>
  </body>
</html>

<!-- Пока поставим # в роли заглушки якоря
 
<p> - это блочный элемент, выделяется на всю доступную ширину страницы 
  и всегда начинаются с новой строчки и выталкивает со своей строчки другие элементы.
   А вот наш Link1 и Link2 выделены только под контент. 

   также блочными элементами являются ВСЕ списки.

   img/video/audio являются строчными элементами, только под контент. 

   div от слова division или же разделитель контента. все в этом тэге станет БЛОЧНЫМ элементом.
   span это строчный элемент, в тексте разницы видно не будет, НО он может выделить строчным элементом что то в блочном элементе.
                                                      --например <p>в стране гласных <span>и</span> согласных живут рыбные тексты</p>
                                                      --при помощи span и css мы сможем застилизовать эту букву.
                                                      --еще у span есть атрибут lang, например <p>в стране гласных <span lang="en">and</span> согласных   живут рыбные тексты</p>
                                                        и ничего не изменится)))) просто браузер будет понимать что это слово англ-кое.

Нельзя вкладывать div внутри span, потому что блочные элементы нельзя вставлять в строчные элементы.
А если сомневаемся то идем на https://caninclude.onrender.com


 -->
