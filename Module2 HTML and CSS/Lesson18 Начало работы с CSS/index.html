<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Start CSS</title>
    <style>
      h1 {
        color: rgb(52, 150, 80);
        width: 100px;
      }
      h2 {
        color: brown;
      }
    </style>
  </head>
  <body>
    <h1>ХУЙ ПИЗДА ДЖИГУРДА</h1>
    <h1>ХУЙ ПИЗДА ДЖИГУРДА</h1>
    <h1>ХУЙ ПИЗДА ДЖИГУРДА</h1>
    <h2>ХУЙ СОСИ ГУБОЙ ТРЯСИ</h2>
  </body>
</html>

<!--
    CSS, или каскадные таблицы стилей, это язык для оформления веб-страниц

    h1 - это селектор, селектор это то как мы обращаемся к каким-то элементам. Раз в данном случае мы написали h1 то это значит что мы выбрали все h1 элементы.
    Внутри фигурных скобок мы прописываем свойства(правила) для селектора, т.е. то как должен выглядеть наш элемент, или то как он должен себя вести. Например color - это имя нашего свойства.

    Есть разные способы написания CSS стилей, например можно что-то прописать прямо в html.
 
    color - цвет
    width - ширина
-->
